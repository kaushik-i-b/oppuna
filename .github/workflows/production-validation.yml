name: Production validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CI validation (skips unavailable release artifacts)
        run: npm run verify:ci
        # Release machines with the real model.gguf and authoritative Gemma terms
        # must additionally run: npm run verify:production
        # Then: npm run verify:aab -- path/to/release.aab
