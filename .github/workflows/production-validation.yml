name: Production validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Secret pattern check
        run: npm run verify:secrets

      - name: Offline configuration
        run: npm run verify:offline

      - name: Model configuration
        run: OPPUNA_CI=1 npm run verify:model

      - name: Privacy / backup configuration
        run: npm run verify:privacy-config

      - name: Android release inspection
        run: npm run inspect:android-release
