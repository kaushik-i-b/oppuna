name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "site/**"
      - ".github/workflows/deploy-privacy.yml"
  workflow_dispatch:

# contents:write publishes the static site to the gh-pages branch.
# pages + id-token support the official Actions Pages deploy when enabled.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build the Next.js marketing site (static export) for custom domain oppuna.com
  # Settings → Pages → Source: Deploy from a branch → gh-pages / (root)
  # Custom domain: oppuna.com (CNAME written during publish)
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build static export for custom domain
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://oppuna.com
        run: npm run build

      - name: Prepare Pages root
        run: |
          mkdir -p _site
          cp -R website/out/. _site/
          if [ -f site/pitch-deck.html ]; then
            cp site/pitch-deck.html _site/pitch-deck.html
          fi
          if [ -d site/investor ]; then
            # Static investor-deck route — does not alter marketing website pages
            mkdir -p _site/investor/assets
            cp site/investor/index.html \
               site/investor/Oppuna-Investor-Pitch-Deck.pptx \
               site/investor/Oppuna-Investor-Pitch-Deck.pdf \
               _site/investor/
            cp site/investor/assets/* _site/investor/assets/ 2>/dev/null || true
          fi
          if [ -f site/favicon.svg ] && [ ! -f _site/favicon.svg ]; then
            cp site/favicon.svg _site/favicon.svg
          fi
          # Ensure custom domain CNAME is always present
          echo "oppuna.com" > _site/CNAME
          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: oppuna.com
          force_orphan: true
          commit_message: "Deploy Oppuna marketing website"

  deploy-actions-pages:
    needs: publish-branch
    if: ${{ vars.ENABLE_ACTIONS_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://oppuna.com
        run: |
          npm ci
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
