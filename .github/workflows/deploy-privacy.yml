name: Deploy privacy policy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - ".github/workflows/deploy-privacy.yml"
  workflow_dispatch:

# contents:write publishes the static site to the gh-pages branch.
# pages + id-token support the official Actions Pages deploy when enabled.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Always publish site/ to the gh-pages branch. Enable hosting with:
  # Settings → Pages → Build and deployment → Source: Deploy from a branch
  # Branch: gh-pages / (root)
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages root
        run: |
          mkdir -p _site
          cp site/index.html site/favicon.svg site/pitch-deck.html _site/
          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Deploy privacy policy site"

  # Optional path used when Pages source is set to GitHub Actions.
  deploy-actions-pages:
    needs: publish-branch
    if: ${{ vars.ENABLE_ACTIONS_PAGES == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
